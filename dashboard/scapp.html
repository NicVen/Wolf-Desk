<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e15" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/scapp.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>STAALCALIBUR</title>
<style>
  :root{--bg:#0a0e15;--card:#131a26;--card2:#18212f;--line:#1e2a3a;--fg:#e7edf3;
    --mut:#7d8a9c;--steel:#8aa0b4;--chrome:#c7d2dd;--accent:#6ea8fe;
    --buy:#2ecc71;--sell:#ff5b5b;--watch:#f2c14e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:10;background:rgba(10,14,21,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:900;letter-spacing:2px;font-size:16px}
  .logo .v{color:var(--steel);font-weight:700}
  .sp{flex:1}
  .ico{background:var(--card);border:1px solid var(--line);color:var(--chrome);border-radius:10px;
    padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer}
  .ico.hasupd{background:var(--accent);color:#04122b;border-color:var(--accent);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(110,168,254,.5)}50%{box-shadow:0 0 0 6px rgba(110,168,254,0)}}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:12px;
    font-size:13px;z-index:60;opacity:0;transition:opacity .25s;max-width:90%;text-align:center;pointer-events:none}
  main{flex:1;padding:14px 16px 40px}
  /* gate */
  .gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:0 6px}
  .gate h1{font-size:26px;letter-spacing:3px;font-weight:900;margin:0}
  .gate .tag{color:var(--mut);font-size:13px;margin:-6px 0 8px}
  input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    color:var(--fg);font-size:16px;text-align:center;letter-spacing:1px}
  .btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#04122b;
    font-size:16px;font-weight:800;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--steel);font-weight:700}
  .err{color:var(--sell);font-size:13px;min-height:18px}
  .muted{color:var(--mut);font-size:12px;line-height:1.5}
  /* class chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--steel);font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--chrome);color:#0a0e15;border-color:var(--chrome)}
  /* list rows */
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
  .row:active{background:var(--card2)}
  .rk{width:26px;color:var(--mut);font-size:12px;font-weight:800;text-align:center}
  .rname{flex:1;min-width:0}
  .rname b{display:block;font-size:15px}
  .rname span{color:var(--mut);font-size:11px}
  .badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px}
  .sc{font-size:20px;font-weight:900;min-width:44px;text-align:right}
  /* verdict banner */
  .verdict{border-radius:16px;padding:18px;text-align:center;margin:6px 0 14px}
  .verdict .big{font-size:30px;font-weight:900;letter-spacing:1px}
  .verdict .conv{font-size:13px;opacity:.9;margin-top:2px}
  .kpis{display:flex;gap:8px;margin:12px 0}
  .kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi .l{color:var(--mut);font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .kpi .v{font-size:15px;font-weight:800;margin-top:3px}
  .sec{margin:16px 0 8px;color:var(--steel);font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0}
  .bar .bl{width:70px;color:var(--mut);font-size:12px}
  .bt{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
  .bt i{display:block;height:100%;background:var(--chrome)}
  .chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .chk .m{width:22px;text-align:center}
  .why{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;
    line-height:1.55;color:var(--chrome)}
  .foot{color:var(--mut);font-size:10px;line-height:1.5;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
  /* direction chart */
  .chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px 8px;margin:4px 0}
  .chart svg{display:block;width:100%;height:120px}
  .chart .lg{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px;font-size:11px;color:var(--mut)}
  .chart .lg i{display:inline-block;width:14px;height:0;border-top:2px solid;margin-right:5px;vertical-align:middle}
  /* trader quiz */
  .qhdr{display:flex;gap:8px;margin:2px 0 12px}
  .qhdr>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
  .qhdr .l{color:var(--mut);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase}
  .qhdr .v{font-size:16px;font-weight:900;margin-top:2px}
  .qintro{color:var(--mut);font-size:12.5px;line-height:1.5;margin:0 0 14px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  .qnum{color:var(--steel);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800}
  .qq{font-size:14.5px;font-weight:600;margin:7px 0 12px;line-height:1.45}
  .qopt{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:7px 0;font-size:14px;
    cursor:pointer;background:var(--bg)}
  .qopt.sel{border-color:var(--accent);background:rgba(110,168,254,.14);color:#fff}
  .qopt:active{background:var(--card2)}
  .qdone{background:rgba(46,204,113,.12);border:1px solid var(--buy);border-radius:12px;padding:13px;
    font-weight:700;text-align:center;margin:4px 0 10px}
  .qres{position:relative;border:1px solid var(--line);border-radius:10px;margin:7px 0;overflow:hidden;
    display:flex;align-items:center;padding:11px 12px;font-size:13.5px}
  .qres .qbar{position:absolute;left:0;top:0;bottom:0;background:var(--line);z-index:0}
  .qres.ok{border-color:var(--buy)} .qres.ok .qbar{background:rgba(46,204,113,.22)}
  .qres.bad{border-color:var(--sell)} .qres.bad .qbar{background:rgba(255,91,91,.18)}
  .qres .qlab{position:relative;z-index:1;flex:1}
  .qres .qpct{position:relative;z-index:1;color:var(--mut);font-weight:700;font-size:12px;margin-left:8px}
  .lbrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;margin:6px 0;font-size:13.5px}
  .lbrow.me{border-color:var(--accent);background:rgba(110,168,254,.1)}
  .lbrow .rk{color:var(--mut);font-weight:800;width:34px}
  .lbrow .aid{flex:1;font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .lbrow .pts{color:var(--steel);font-weight:800}
  /* refer & earn card */
  .refcard{background:linear-gradient(135deg,rgba(110,168,254,.16),rgba(46,204,113,.10));
    border:1px solid var(--accent);border-radius:16px;padding:16px 16px 15px;margin:2px 0 14px}
  .reftop{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:800}
  .refbig{font-size:17px;font-weight:800;margin:6px 0 12px}
  .refbig b{color:var(--buy)}
  .refstats{display:flex;gap:10px;margin-bottom:12px}
  .refstats>div{flex:1;background:rgba(10,14,21,.35);border:1px solid var(--line);border-radius:12px;
    padding:9px;text-align:center}
  .refstats b{display:block;font-size:22px;font-weight:900}
  .refstats span{font-size:10.5px;color:var(--mut);letter-spacing:.5px}
  .refnote{font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:12px}
  .refnote.ok{color:var(--buy)}
  .refbtn{padding:13px;font-size:15px}
  /* today's outlook card */
  .olcard{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin:2px 0 4px;cursor:pointer}
  .olcard:active{border-color:var(--steel)}
  .oltop{color:var(--steel);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800}
  .olhead{font-size:15px;font-weight:800;margin:5px 0 3px}
  .olcta{color:var(--accent);font-size:12px;font-weight:700}
  /* timeframe switch */
  .tfsw{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .tfb{background:var(--card);color:var(--steel);border:0;padding:5px 12px;font-size:12px;font-weight:800;
    letter-spacing:1px;cursor:pointer}
  .tfb.on{background:var(--chrome);color:#0a0e15}
  .tfb:disabled{opacity:.35;cursor:not-allowed}
  /* tappable tiles */
  .kpi.tap{cursor:pointer}
  .kpi.tap .i{display:block;float:right;color:var(--mut);font-size:11px;line-height:1;margin:-2px -2px 0 0}
  .kpi.tap:active{background:var(--card2)}
  /* info sheet */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(4,8,14,.72);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card2);border:1px solid var(--line);border-top-left-radius:18px;border-top-right-radius:18px;
    width:100%;max-width:520px;max-height:82vh;overflow:auto;padding:18px 18px calc(26px + env(safe-area-inset-bottom))}
  .sheet .sub{color:var(--steel);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
  .sheet h3{margin:0 0 4px;font-size:19px}
  .sheet .val{font-size:22px;font-weight:900;margin:2px 0 6px;color:var(--chrome)}
  .sheet p{font-size:14px;line-height:1.6;color:var(--chrome);margin:10px 0}
  .sheet ul.upd{margin:10px 0 16px;padding-left:18px}
  .sheet ul.upd li{font-size:14px;line-height:1.55;color:var(--chrome);margin:7px 0}
  .sheet a.hl{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin:7px 0;text-decoration:none}
  .sheet a.hl b{display:block;color:var(--fg);font-size:13px;line-height:1.4;font-weight:700}
  .sheet a.hl span{display:block;color:var(--mut);font-size:11px;margin-top:3px}
  .sheet .x{float:right;background:var(--card);border:1px solid var(--line);color:var(--chrome);
    border-radius:10px;padding:6px 12px;font-weight:800;cursor:pointer}
  .hidden{display:none}
  /* ideas board */
  .idea{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;margin:8px 0}
  .idea .tx{flex:1;font-size:14px;line-height:1.45;color:var(--fg)}
  .idea .tg{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-bottom:4px}
  .vote{min-width:58px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card2);
    color:var(--steel);font-weight:800;font-size:14px;cursor:pointer}
  .vote.on{background:var(--chrome);color:#0a0e15;border-color:var(--chrome)}
  .idea.built .tx{color:var(--chrome)}
  .nextup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--chrome);margin:8px 0}
  /* toolkit tiles + risk sizer */
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
  .tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}
  .tool:active{background:var(--card2)}
  .tool b{display:block;font-size:13px}
  .tool span{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-top:3px;font-weight:800}
  .tool .free{color:var(--buy)} .tool .soon{color:var(--watch)}
  .rs label{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:12px 0 5px}
  .rs input,.rs select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--fg);font-size:16px;text-align:left;letter-spacing:0}
  .rs .two{display:flex;gap:8px} .rs .two>div{flex:1;min-width:0}
  .rsout{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0 6px;text-align:center}
  .rsout .big{font-size:30px;font-weight:900}
  .rsout .sm{color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">STAALCALIBUR <span class="v">V13</span></div>
    <div class="sp"></div>
    <button class="ico" id="verBtn" onclick="manualCheck()" title="Check for updates">v·</button>
    <button class="ico" id="refreshBtn" onclick="loadClass()" style="display:none">↻</button>
    <button class="ico" id="homeBtn" onclick="showHome()" style="display:none">Home</button>
  </header>
  <main id="main"></main>
</div>

<script>
var PAY = "https://pay.178.104.88.38.sslip.io";
var CLASSES = [["commodities","Commodities"],["fx","FX"],["indices","Indices"],["stocks","Stocks"],["crypto","Crypto"]];
var CUR = "commodities";
var DATA = null;

function K(){ try{return localStorage.getItem("sc_key")||"";}catch(e){return "";} }
function DEV(){ try{ var d=localStorage.getItem("sc_dev"); if(!d){ d=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)); localStorage.setItem("sc_dev",d);} return d; }catch(e){return "web";} }
function el(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

// ---------- verdict helpers ----------
function verdictOf(o){ return (o.analysis && o.analysis.verdict) ? o.analysis.verdict.toUpperCase() : (o.score>=60?"BUY":o.score>=45?"WATCH":"SELL"); }
function vColor(v){ return v==="BUY"?"var(--buy)":v==="SELL"?"var(--sell)":"var(--watch)"; }
function scColor(s){ return s>=65?"var(--buy)":s>=50?"var(--watch)":"var(--sell)"; }
function regState(reg){ return (reg && reg.state) ? String(reg.state).toUpperCase() : ""; }
function valText(o){ return (o.validation && o.validation.label) ? String(o.validation.label) : ""; }
var CO = null;   // opportunity currently on the consult screen (for info popups)
var CP = null;   // trade plan for the current opportunity
var CM = null;   // active-timeframe metrics for the current opportunity
var CIDX = -1;   // index of the current opportunity (for re-render on TF switch)
var TF = "1h";   // "1h" | "daily"

// price formatting: more decimals for small-priced instruments
function fmt(n){ if(n==null||!isFinite(n)) return "—"; var p=Math.abs(n);
  var d = p>=100?2 : p>=1?4 : 6; return Number(n).toFixed(d); }

// metrics for the active timeframe (1H is the row itself; Daily is o.daily)
function tfMetrics(o){
  if(TF==="daily" && o.daily){
    var d=o.daily;
    return {price:d.last, atr_pct:d.atr_pct, atr_abs:d.atr_abs, ma20:d.ma20, ma50:d.ma50,
      mom20:d.mom20, above_ma20:d.above_ma20, above_ma50:d.above_ma50,
      regime:d.regime, spark:d.spark, swing_lo:d.swing_lo, swing_hi:d.swing_hi, tf:"daily"};
  }
  return {price:o.price, atr_pct:o.atr_pct, atr_abs:o.atr_abs, ma20:o.ma20, ma50:o.ma50,
    mom20:o.mom20, above_ma20:o.above_ma20, above_ma50:o.above_ma50,
    regime:o.regime, spark:o.spark, swing_lo:o.swing_lo, swing_hi:o.swing_hi, tf:"1h"};
}

// ---------- trade plan (entry / stop / target) ----------
// Stop is placed beyond the recent swing (structure) when that's sane; otherwise
// it falls back to 1.5x ATR. Target is at 2R (1:2 reward-to-risk).
function tradePlan(m, v){
  var price=Number(m.price), atrp=Number(m.atr_pct);
  if(!isFinite(price)||price<=0||!isFinite(atrp)||atrp<=0) return null;
  if(v!=="BUY" && v!=="SELL") return null;          // WATCH = no trade yet
  var atr = (isFinite(m.atr_abs) && m.atr_abs>0) ? Number(m.atr_abs) : price*atrp/100;
  var rr=2, entry=price, buf=0.25*atr, sl, risk, basis="atr", swing=null;
  if(v==="BUY"){
    var swl=Number(m.swing_lo);
    if(isFinite(swl) && swl>0 && swl<price){ sl=swl-buf; basis="structure"; swing=swl; }
    else { sl=price-1.5*atr; }
    risk=price-sl;
    if(risk < 0.5*atr){ sl=price-1.5*atr; risk=price-sl; basis="atr"; swing=null; }   // too tight
    else if(risk > 3.5*atr){ sl=price-1.5*atr; risk=price-sl; basis="atr"; swing=null; } // too far
    var tp=price+rr*risk;
  } else {
    var swh=Number(m.swing_hi);
    if(isFinite(swh) && swh>price){ sl=swh+buf; basis="structure"; swing=swh; }
    else { sl=price+1.5*atr; }
    risk=sl-price;
    if(risk < 0.5*atr){ sl=price+1.5*atr; risk=sl-price; basis="atr"; swing=null; }
    else if(risk > 3.5*atr){ sl=price+1.5*atr; risk=sl-price; basis="atr"; swing=null; }
    var tp=price-rr*risk;
  }
  return {dir:v, entry:entry, sl:sl, tp:tp, atr:atr, risk:risk, rr:rr,
          riskPct:risk/price*100, basis:basis, swing:swing};
}

// ---------- direction chart (inline SVG sparkline + trade levels) ----------
function sparkSVG(m, plan){
  var o=m;
  var s=(o.spark||[]).filter(function(x){return typeof x==="number" && isFinite(x);});
  if(s.length<2) return "";
  var refs=[]; if(o.ma20!=null) refs.push(o.ma20); if(o.ma50!=null) refs.push(o.ma50);
  if(plan){ refs.push(plan.entry, plan.sl, plan.tp); }   // keep levels in view
  var all=s.concat(refs);
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  if(hi<=lo){ hi=lo+1; }
  var pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  var W=300,H=130,PL=4,PR=4,PT=8,PB=8;
  function x(i){ return PL + i/(s.length-1)*(W-PL-PR); }
  function y(v){ return PT + (1-(v-lo)/(hi-lo))*(H-PT-PB); }
  var up = s[s.length-1] >= s[0];
  var col = up? "var(--buy)":"var(--sell)";
  var d="M"+x(0).toFixed(1)+" "+y(s[0]).toFixed(1);
  for(var i=1;i<s.length;i++){ d+=" L"+x(i).toFixed(1)+" "+y(s[i]).toFixed(1); }
  var area=d+" L"+x(s.length-1).toFixed(1)+" "+(H-PB)+" L"+x(0).toFixed(1)+" "+(H-PB)+" Z";
  function refLine(vv,c,dash,w){ if(vv==null) return ""; var yy=y(vv).toFixed(1);
    return '<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="'+c+'" stroke-width="'+(w||1)+'" stroke-dasharray="'+dash+'" opacity=".85"/>'; }
  var gid="g"+Math.random().toString(36).slice(2,7);
  var levels="";
  if(plan){
    levels += refLine(plan.tp,"var(--buy)","5 3",1.4);
    levels += refLine(plan.entry,"var(--steel)","1 0",1.4);
    levels += refLine(plan.sl,"var(--sell)","5 3",1.4);
  }
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+gid+')" stroke="none"/>'+
    refLine(o.ma50,"var(--mut)","2 3")+refLine(o.ma20,"var(--steel)","4 2")+
    levels+

// Plain word-overlap match against the board (no AI): catches "already built"
// and "already on the board" before a repeat is ever sent.
var STOP={"the":1,"and":1,"for":1,"with":1,"please":1,"add":1,"can":1,"you":1,"app":1,"would":1,"like":1,"have":1,"that":1,"this":1,"make":1,"more":1,"should":1,"could":1,"when":1,"what":1,"from":1,"into":1,"also":1,"want":1,"need":1};
function _words(t){ var o={}; (String(t).toLowerCase().match(/[a-z0-9]+/g)||[]).forEach(function(w){
  if(w.length>2 && !STOP[w]) o[w.replace(/s$/,"")]=1; }); return o; }
function _sim(a,b){ var A=_words(a),B=_words(b),n=0,na=0,nb=0,k;
  for(k in A){ na++; if(B[k]) n++; } for(k in B) nb++;
  return (na&&nb)? n/Math.min(na,nb) : 0; }
function checkDup(){
  var box=el("sgDup"); if(!box) return;
  var t=(el("sgText").value||"").trim(), best=null, bs=0;
  if(t.length>=8 && IDEAS) IDEAS.ideas.forEach(function(x){ var v=_sim(t,x.text); if(v>bs){ bs=v; best=x; } });
  if(!best || bs<0.6){ box.innerHTML=""; return; }
  box.innerHTML='<div class="nextup" style="margin-top:8px">'+(best.status==="built"
    ? '✅ <b>Already built:</b> “'+esc(best.text)+'”. Tap Update in the app if you don’t see it yet.'
    : '💡 <b>Already on the board:</b> “'+esc(best.text)+'” · 👍 '+(+best.votes)+
      (best.mine?'<br><span class="muted">You already voted for this one.</span>'
        :'<br><button class="vote" style="margin-top:8px;width:100%" onclick="voteIdea('+(+best.id)+',this)">👍 Vote for it instead</button>'))+
    '</div>';
}

var updSnoozed = false, UPD_AVAILABLE = false;
function installedVer(){ try{ return localStorage.getItem("sc_ver")||""; }catch(e){ return ""; } }
function setInstalledVer(v){ try{ localStorage.setItem("sc_ver", v); }catch(e){} setVerLabel(); }
function verCmp(a,b){
  var pa=String(a).split("."), pb=String(b).split("."), n=Math.max(pa.length,pb.length);
  for(var i=0;i<n;i++){ var x=parseInt(pa[i]||"0",10)||0, y=parseInt(pb[i]||"0",10)||0;
    if(x>y) return 1; if(x<y) return -1; }
  return 0;
}
function setVerLabel(){ var b=el("verBtn"); if(b) b.textContent = "v"+(installedVer()||"·"); }

  var t=el("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(function(){ t.style.opacity="0"; }, 2800);
}
// silent check on open/resume — glows the version button if something's newer.
function checkUpdate(){
  fetch("/appversion?_="+Date.now(),{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    if(!d||!d.version) return;

    if(!cur){ setInstalledVer(d.version); return; }   // first run: adopt current silently
    if(verCmp(d.version,cur)>0){ markUpd(true); if(!updSnoozed) showUpdate(d); }
    else { markUpd(false); }
  }).catch(function(){});
}

    if(verCmp(d.version,cur)>0){ updSnoozed=false; markUpd(true); showUpdate(d); }

  }).catch(function(){ toast("Network error — try again."); });

// ---------- shareable branded card (canvas -> native share / download) ----------
function _wrap(ctx,text,x0,y0,maxW,lh,maxLines){
  var words=(text||"").split(" "), line="", y=y0, n=0;
  for(var i=0;i<words.length;i++){
    var t=line+words[i]+" ";
    if(ctx.measureText(t).width>maxW && line){
      ctx.fillText(line.trim(),x0,y); line=words[i]+" "; y+=lh; n++;
      if(n>=maxLines-1){ break; }
    } else line=t;
  }
  ctx.fillText(line.trim(),x0,y);
}

function doUpdate(){
  var b=el("updBtn"); if(b){ b.textContent="Updating…"; b.disabled=true; }
  function finish(){
    fetch("/appversion",{cache:"no-store"}).then(function(r){ return r.json(); })
      .then(function(d){ if(d&&d.version) setInstalledVer(d.version); })
      .catch(function(){})
      .then(function(){ location.reload(true); });
  }
  try{
    var jobs=[];
    if(window.caches){ jobs.push(caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }
    if("serviceWorker" in navigator){ jobs.push(
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(!reg) return; try{ reg.update(); }catch(e){}
        if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
      }).catch(function(){})); }
    Promise.all(jobs).then(finish, finish);
  }catch(e){ finish(); }
}

// ---------- STAALWAG toolkit: free Risk Sizer + coming-soon add-ons ----------
// Contract size per 1.00 lot. `pip` = how far one pip/point moves the price.
// USD-base pairs (USDJPY...) are priced in the other currency, so we need the
// current price to turn the stop into US dollars. Brokers differ on indices,
// oil and crypto, so those go through "Other" with the trader's own figure.
var RS_SYMS=[
  ["XAUUSD","Gold (XAUUSD)",100,1,"usd","$"],
  ["XAGUSD","Silver (XAGUSD)",5000,1,"usd","$"],
  ["EURUSD","EURUSD",100000,0.0001,"usd","pips"],
  ["GBPUSD","GBPUSD",100000,0.0001,"usd","pips"],
  ["AUDUSD","AUDUSD",100000,0.0001,"usd","pips"],
  ["NZDUSD","NZDUSD",100000,0.0001,"usd","pips"],
  ["USDJPY","USDJPY",100000,0.01,"base","pips"],
  ["USDCAD","USDCAD",100000,0.0001,"base","pips"],
  ["USDCHF","USDCHF",100000,0.0001,"base","pips"],
  ["BTCUSD","Bitcoin (BTCUSD)",1,1,"usd","$"],
  ["OTHER","Other (your broker's figure)",1,1,"custom","points"]
];
function rsSym(code){ for(var i=0;i<RS_SYMS.length;i++) if(RS_SYMS[i][0]===code) return RS_SYMS[i]; return RS_SYMS[0]; }
// Pure maths, no network: the lot size that risks `pct`% of `equity` if the
// stop is hit. Rounded DOWN to 0.01 so it never risks more than asked.
function sizeLots(equity, pct, code, stop, price, perPoint){
  var s=rsSym(code), riskUsd=equity*pct/100, perLot;
  if(!(equity>0)||!(pct>0)||!(stop>0)) return null;
  if(s[4]==="custom"){ if(!(perPoint>0)) return null; perLot=stop*perPoint; }
  else {
    perLot=stop*s[3]*s[2];                                // loss per lot in the quote currency
    if(s[4]==="base"){ if(!(price>0)) return null; perLot=perLot/price; }
  }
  var lots=Math.floor(riskUsd/perLot*100+1e-9)/100;
  return {lots:lots, riskUsd:riskUsd, actualUsd:lots*perLot, perLot:perLot};
}

// which add-ons this key unlocks; the tiles redraw when the answer arrives
function loadAccess(){
  fetch("/appaccess?key="+encodeURIComponent(K())+"&dev="+encodeURIComponent(DEV()),{cache:"no-store"})
    .then(function(r){ return r.json(); }).then(function(d){
      ACCESS={hours:!!(d&&d.hours),guardian:!!(d&&d.guardian)};
      var t=el("tools"); if(t) t.innerHTML=toolsInner();
    }).catch(function(){});
}

// ---------- Prime Hours: when each market really moves (paid add-on) ----------
var HOURS=null, HSYM="";
try{ HSYM=localStorage.getItem("sc_hsym")||""; }catch(e){}
function openHours(){
  el("refreshBtn").style.display="none"; el("homeBtn").style.display="";
  el("main").innerHTML='<p class="muted">Loading Prime Hours…</p>';
  fetch("/apphours?key="+encodeURIComponent(K())+"&dev="+encodeURIComponent(DEV()),{cache:"no-store"})
    .then(function(r){ if(r.status===403) throw {code:403}; return r.json(); })
    .then(function(d){ HOURS=d; renderHours(); })
    .catch(function(e){
      el("main").innerHTML='<p class="muted">'+(e&&e.code===403?"Prime Hours isn't unlocked on this key.":"Network error. Try again.")+'</p>';
    });
}
// local start of a UTC hour, as "14:00" (handles half-hour time zones)
var _OFF=-new Date().getTimezoneOffset();          // minutes east of UTC
function _lmin(h){ return (((h*60+_OFF)%1440)+1440)%1440; }
function _hm(m){ var h=Math.floor(m/60), mm=m%60; return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm; }
function _span(w){ return w ? _hm(_lmin(w.start))+" – "+_hm(_lmin(w.end)) : "—"; }
function _inWin(w,utcH){ if(!w) return false; return w.start<=w.end ? (utcH>=w.start&&utcH<w.end) : (utcH>=w.start||utcH<w.end); }
function renderHours(){
  var syms=(HOURS&&HOURS.symbols)||{}, keys=Object.keys(syms);
  if(!keys.length){
    el("main").innerHTML='<div class="sec" style="margin-top:4px">Prime Hours</div><p class="muted">'+
      (HOURS&&HOURS.building?"Crunching 2 years of hourly prices for every market. Check back in a few minutes.":"No data yet.")+'</p>';
    return;
  }
  keys.sort(function(a,b){ return String(syms[a].name).localeCompare(String(syms[b].name)); });
  if(!syms[HSYM]){ HSYM = syms["GC=F"] ? "GC=F" : keys[0]; }
  var p=syms[HSYM], nowH=new Date().getUTCHours();
  var order=[]; for(var h=0;h<24;h++) order.push(h);
  order.sort(function(a,b){ return _lmin(a)-_lmin(b); });
  var bars=order.map(function(h){
    var v=p.hours[h]||0, prime=_inWin(p.prime,h), dead=_inWin(p.dead,h);
    var c = prime ? "var(--buy)" : dead ? "var(--sell)" : "var(--steel)";
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">'+
      '<div style="height:'+Math.max(3,v)+'%;background:'+c+';opacity:'+(v?0.35+v/160:0.15)+';border-radius:3px 3px 0 0'+
      (h===nowH?';outline:2px solid var(--fg)':'')+'"></div></div>';
  }).join("");
  var ticks=[0,6,12,18].map(function(i){ return '<span>'+_hm(_lmin(order[i])).slice(0,5)+'</span>'; }).join("");
  var live=_inWin(p.prime,nowH)?'<span class="badge" style="background:rgba(46,204,113,.15);color:var(--buy)">PRIME NOW</span>'
    : _inWin(p.dead,nowH)?'<span class="badge" style="background:rgba(255,91,91,.15);color:var(--sell)">DEAD ZONE NOW</span>':'';
  var days=(p.days||[]).map(function(d){
    return '<div style="flex:1;text-align:center"><div style="height:70px;display:flex;align-items:flex-end">'+
      '<div style="width:100%;height:'+Math.max(4,d.score)+'%;background:var(--chrome);opacity:'+(0.35+d.score/160)+';border-radius:4px 4px 0 0"></div></div>'+
      '<div class="muted" style="margin-top:4px">'+esc(d.day)+'</div></div>';
  }).join("");
  el("main").innerHTML=
    '<div class="sec" style="margin-top:4px">Prime Hours</div>'+
    '<select id="hSym" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px">'+
      keys.map(function(k){ return '<option value="'+esc(k)+'"'+(k===HSYM?' selected':'')+'>'+esc(syms[k].name)+'</option>'; }).join("")+'</select>'+
    '<div class="chart" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<span class="muted">MOVEMENT BY HOUR · YOUR TIME</span>'+live+'</div>'+
      '<div style="display:flex;gap:2px;height:110px;align-items:stretch">'+bars+'</div>'+
      '<div class="muted" style="display:flex;justify-content:space-between;margin-top:6px">'+ticks+'</div></div>'+
    '<div class="chk"><span class="m">🔥</span><b style="flex:1">Prime window</b><span>'+_span(p.prime)+'</span></div>'+
    '<div class="chk"><span class="m">💤</span><b style="flex:1">Dead zone · sit out</b><span>'+_span(p.dead)+'</span></div>'+
    '<div class="sec">Best days to trade it</div><div style="display:flex;gap:8px">'+days+'</div>'+
    '<div class="foot">Shown in your local time. Built from '+esc(p.trading_days)+' trading days of real hourly prices. '+
      'How much a market moves is not which way it moves. Education only, not financial advice.</div>';
  el("hSym").onchange=function(){ HSYM=this.value; try{ localStorage.setItem("sc_hsym",HSYM); }catch(e){} renderHours(); };
}
var SOON={
  hours:["Prime Hours","When each market really moves",
    "<p>Pick a symbol and see a heatmap of the hours it moves most, in your own time zone. "+
    "It marks the prime window to trade and the dead zone to sit out, plus the best days of the week.</p>"+
    "<p>Built from years of real hourly prices. Coming to the app soon.</p>"],
  guardian:["Guardian","Your buddy over your shoulder",
    "<p>Links read-only to your MT5 account. It never places or closes a trade.</p>"+
    "<p>The moment you open a trade it checks the size, the time and the news, and tells you straight: "+
    "<b>NO, sit this out</b>, or you're good. Warnings reach your phone even when the app is closed.</p>"+
    "<p>Challenge mode loads your prop firm's daily-loss and max-loss rules. Coming to the app soon.</p>"]
};
function soonTool(k){ var t=SOON[k]; openSheet(t[0],"Coming soon",t[1],t[2]); }
var RS={equity:"",pct:"1",sym:"XAUUSD",stop:"",price:"",per:""};
try{ var _rs=JSON.parse(localStorage.getItem("sc_rs")||"null"); if(_rs) for(var _k in RS) if(_rs[_k]!=null) RS[_k]=_rs[_k]; }catch(e){}
function openSizer(){
  el("refreshBtn").style.display="none"; el("homeBtn").style.display="";
  if(!K()) el("homeBtn").onclick=function(){ el("homeBtn").onclick=showHome; showGate(); };
  el("main").innerHTML='<div class="rs">'+
    '<div class="sec" style="margin-top:4px">Risk Sizer · free</div>'+
    '<div class="muted">The biggest lot size you can take without risking more than you planned if your stop is hit.</div>'+
    '<div class="two"><div><label for="rsEq">Account equity ($)</label><input id="rsEq" inputmode="decimal" placeholder="10000"></div>'+
    '<div><label for="rsPct">Risk per trade (%)</label><input id="rsPct" inputmode="decimal" placeholder="1"></div></div>'+
    '<label for="rsSym">Symbol</label><select id="rsSym">'+RS_SYMS.map(function(s){ return '<option value="'+s[0]+'">'+esc(s[1])+'</option>'; }).join("")+'</select>'+
    '<label for="rsStop" id="rsStopL">Stop distance</label><input id="rsStop" inputmode="decimal">'+
    '<div id="rsPriceW"><label for="rsPrice">Current price</label><input id="rsPrice" inputmode="decimal"></div>'+
    '<div id="rsPerW"><label for="rsPer">$ per 1 point on 1.00 lot (from your broker)</label><input id="rsPer" inputmode="decimal" placeholder="1"></div>'+
    '<div class="rsout" id="rsOut"></div>'+
    '<div class="muted">Assumes a US-dollar account. Brokers can use different contract sizes, so check yours on a new symbol. Education only, not financial advice.</div>'+
  '</div>';
  el("rsEq").value=RS.equity; el("rsPct").value=RS.pct; el("rsSym").value=RS.sym;
  el("rsStop").value=RS.stop; el("rsPrice").value=RS.price; el("rsPer").value=RS.per;
  ["rsEq","rsPct","rsStop","rsPrice","rsPer"].forEach(function(id){ el(id).oninput=calcSizer; });
  el("rsSym").onchange=function(){ el("rsStop").value=""; calcSizer(); };
  calcSizer();
}
function _num(id){ return parseFloat(String(el(id).value||"").replace(/[, ]/g,"")); }
function calcSizer(){
  var s=rsSym(el("rsSym").value);
  el("rsStopL").textContent = s[5]==="pips" ? "Stop distance (pips)" : s[5]==="$" ? "Stop distance ($ in price, e.g. 8.50)" : "Stop distance (points)";
  el("rsStop").placeholder = s[5]==="pips" ? "25" : s[0]==="BTCUSD" ? "800" : s[5]==="$" ? "8.50" : "50";
  el("rsPriceW").className = s[4]==="base" ? "" : "hidden";
  el("rsPerW").className = s[4]==="custom" ? "" : "hidden";
  RS={equity:el("rsEq").value,pct:el("rsPct").value,sym:s[0],stop:el("rsStop").value,price:el("rsPrice").value,per:el("rsPer").value};
  try{ localStorage.setItem("sc_rs",JSON.stringify(RS)); }catch(e){}
  var r=sizeLots(_num("rsEq"),_num("rsPct"),s[0],_num("rsStop"),_num("rsPrice"),_num("rsPer")), out=el("rsOut");
  if(!r){ out.innerHTML='<div class="sm">Fill in the boxes above to get your lot size.</div>'; return; }
  if(r.lots<0.01){
    out.innerHTML='<div class="big" style="color:var(--sell)">Too wide</div><div class="sm">Even 0.01 lots would risk $'+fmtUsd(r.perLot*0.01)+
      ', more than your $'+fmtUsd(r.riskUsd)+'. Use a closer stop or skip this trade.</div>';
    return;
  }
  var pctWarn=_num("rsPct")>2 ? '<div class="sm" style="color:var(--watch)">Traders who pass prop challenges usually risk 0.5–1% per trade.</div>' : '';
  out.innerHTML='<div class="big" style="color:var(--buy)">'+r.lots.toFixed(2)+' lots</div>'+
    '<div class="sm">Risks $'+fmtUsd(r.actualUsd)+' if the stop is hit (your limit: $'+fmtUsd(r.riskUsd)+').</div>'+pctWarn;
}
function fmtUsd(n){ return (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ---------- boot + PWA ----------
try{ var _tf=localStorage.getItem("sc_tf"); if(_tf==="daily"||_tf==="1h") TF=_tf; }catch(e){}
setVerLabel();
if(K()){ CUR="commodities"; showHome(); } else { showGate(); }
// updateViaCache:none stops the browser HTTP-cache from pinning an old worker.
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/scsw.js", {updateViaCache:"none"}).catch(function(){}); }
checkUpdate();
document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkUpdate(); });
</script>

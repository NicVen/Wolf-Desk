name: Money-path tests

# Checkout, payment and licence activation must keep working. Runs on every
# PR and push; no secrets needed (PayPal/NOWPayments/Telegram are faked).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
